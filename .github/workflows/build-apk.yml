name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Download Inter font
        run: bash tool/get_fonts.sh

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.codesoli --project-name nova --no-pub .
          # `flutter create` must not overwrite our sources; restore them if it did.
          for p in lib pubspec.yaml analysis_options.yaml test README.md; do
            git checkout -- "$p" || true
          done
          bash tool/patch_android.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK file
        run: cp build/app/outputs/flutter-apk/app-release.apk nova.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nova-apk
          path: nova.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: Nova ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: nova.apk
          generate_release_notes: true
          make_latest: true
